name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest upload
        run: |
          f=$(git log -1 --format= --name-only --diff-filter=AM -- '*.zip' | head -n 1)
          echo "Building from: $f"
          unzip -q -o "$f"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        working-directory: ThumbGallery
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ThumbGallery-apk
          path: ThumbGallery/app/build/outputs/apk/debug/*.apk
